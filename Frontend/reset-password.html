<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI SafeSight</title>
    <link rel="icon" href="logo.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-page">
    <div class="login-side">
      <div class="logo-block">
        <img src="logo-dark-bg.svg" alt="" />
        <div class="wordmark"><span>AI</span> SafeSight</div>
        <div class="tagline" data-i18n="tagline"></div>
      </div>
    </div>

    <div class="login-form-wrap">
      <button class="lang-btn" onclick="toggleLang()" data-i18n="langBtn"></button>

      <form class="login-box" id="newPasswordForm" novalidate>
        <div class="mobile-brand logo-block">
          <img src="logo.svg" alt="" />
          <div class="wordmark"><span>AI</span> SafeSight</div>
        </div>
        <h2 data-i18n="newPasswordTitle"></h2>

        <div id="fields">
          <label for="password" data-i18n="newPassword"></label>
          <input type="password" id="password" autocomplete="new-password" />
          <label for="confirm" data-i18n="confirmPassword"></label>
          <input type="password" id="confirm" autocomplete="new-password" />
          <button type="submit" id="saveBtn" class="primary-btn" data-i18n="savePassword"></button>
          <p id="message" class="form-message" role="alert"></p>
        </div>

        <p id="success" class="form-success" data-i18n="passwordChanged" hidden></p>
        <a href="index.html" class="back-link" data-i18n="backToLogin"></a>
      </form>
    </div>

    <script src="i18n.js"></script>
    <script src="auth.js"></script>
    <script src="api.js"></script>
    <script>
      const token = new URLSearchParams(location.search).get("token");
      const form = document.getElementById("newPasswordForm");
      const message = document.getElementById("message");
      const saveBtn = document.getElementById("saveBtn");
      let lastError = "";

      function showError(key) {
        lastError = key;
        message.textContent = key ? t(key) : "";
      }

      if (!token) showError("resetLinkInvalid");

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm").value;

        if (!token) return showError("resetLinkInvalid");
        if (password.length < 8) return showError("passwordTooShort");
        if (password !== confirm) return showError("passwordsDontMatch");

        showError("");
        saveBtn.disabled = true;
        try {
          await resetPassword(token, password);
          document.getElementById("fields").hidden = true;
          document.getElementById("success").hidden = false;
        } catch (err) {
          showError(err.status === 400 ? "resetLinkInvalid" : "apiError");
        } finally {
          saveBtn.disabled = false;
        }
      });

      document.addEventListener("langchange", function () {
        if (lastError) message.textContent = t(lastError);
      });
</script>
  </body>
</html>
