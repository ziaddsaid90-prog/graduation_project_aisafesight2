<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI SafeSight</title>
    <link rel="icon" href="logo.svg" />
    <link rel="stylesheet" href="style.css?v=20261124d" />
  </head>
  <body class="login-page">
    <div class="login-side">
      <div class="logo-block">
        <img src="logo-dark-bg.svg" alt="" />
        <div class="wordmark"><span>AI</span> SafeSight</div>
        <div class="tagline" data-i18n="tagline"></div>
      </div>
    </div>

    <div class="login-form-wrap">
      <button class="lang-btn" onclick="toggleLang()" data-i18n="langBtn"></button>

      <form class="login-box" id="resetForm" novalidate>
        <div class="mobile-brand logo-block">
          <img src="logo.svg" alt="" />
          <div class="wordmark"><span>AI</span> SafeSight</div>
        </div>
        <h2 data-i18n="resetTitle"></h2>
        <p class="muted" data-i18n="resetIntro"></p>

        <div id="resetFields">
          <label for="email" data-i18n="email"></label>
          <input type="email" id="email" autocomplete="username" data-i18n-placeholder="emailPlaceholder" />
          <button type="submit" id="resetBtn" class="primary-btn" data-i18n="sendResetLink"></button>
          <p id="message" class="form-message" role="alert"></p>
        </div>

        <p id="success" class="form-success" data-i18n="resetSent" hidden></p>

        <a href="index.html" class="back-link" data-i18n="backToLogin"></a>
      </form>
    </div>

    <script src="i18n.js?v=20261124d"></script>
    <script src="auth.js?v=20261124d"></script>
    <script src="api.js?v=20261124d"></script>
    <script>
      const form = document.getElementById("resetForm");
      const emailInput = document.getElementById("email");
      const message = document.getElementById("message");
      const resetBtn = document.getElementById("resetBtn");
      let lastError = "";

      function showError(key) {
        lastError = key;
        message.textContent = key ? t(key) : "";
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        const email = emailInput.value.trim();
        if (email === "") return showError("emailRequired");
        if (!emailInput.checkValidity()) return showError("emailInvalid");

        showError("");
        resetBtn.disabled = true;
        resetBtn.textContent = t("sending");
        try {
          await requestPasswordReset(email);
          document.getElementById("resetFields").hidden = true;
          document.getElementById("success").hidden = false;
        } catch (err) {
          showError("apiError");
        } finally {
          resetBtn.disabled = false;
          resetBtn.textContent = t("sendResetLink");
        }
      });

      document.addEventListener("langchange", function () {
        if (lastError) message.textContent = t(lastError);
      });
</script>
  </body>
</html>
